name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS 语法检查
        run: |
          node --check lib/index.mjs
          node --check test/smoke.mjs
          node --check test/headless.mjs
          node --check test/register.mjs
      - name: 注册冒烟（15 工具 + 降级路径）
        run: npm test
