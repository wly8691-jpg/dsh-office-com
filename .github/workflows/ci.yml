name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JS 语法检查
        run: |
          node --check lib/index.mjs
          node --check test/smoke.mjs
          node --check test/headless.mjs
          node --check test/register.mjs
          node --check test/leakcheck.mjs
          node --check test/flagship.mjs
          node --check test/tasks.mjs
      - name: 注册冒烟（15 工具 + 降级路径 + v0.3 模式契约）
        run: npm test
      # 注意：test:e2e / test:leak / test:flagship 都要本机真实 Office，不在 CI 跑
